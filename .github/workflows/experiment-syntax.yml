name: Experiment source syntax

on:
  push:
  pull_request:

jobs:
  compile-experiments:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile experiment modules
        run: python -m compileall -q experiments
